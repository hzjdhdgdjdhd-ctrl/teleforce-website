name: Deploy

# Deployment is a separate workflow that requires CI to have passed. Chaining
# it to the same job would let a green-looking run deploy on a step that was
# skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never deploy a failed build.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    strategy:
      # One failing app must not leave the others undeployed and the fleet
      # split across two versions.
      fail-fast: false
      matrix:
        app: [website, agent, admin, supervisor, qa]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A missing secret otherwise surfaces as a wrangler authentication
      # stack trace, which reads like a broken build rather than an unset
      # variable. Say which one is missing and where to set it.
      - name: Check deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "::error::Add them at Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Deployment secrets present."

      - name: Build ${{ matrix.app }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build -w @teleforce/${{ matrix.app }}

      - name: Deploy ${{ matrix.app }}
        uses: cloudflare/wrangler-action@v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          # These are Workers, not Pages projects. Each app has a
          # wrangler.jsonc with an edge script (noindex headers, canonical
          # host redirect), an assets binding and a custom domain route —
          # `wrangler deploy` is what reads that. `pages deploy` would ignore
          # the config entirely, drop the edge script, and try to create Pages
          # projects competing for the same hostnames.
          command: deploy
